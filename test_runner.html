<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Browser Test Runner</title>
</head>
<body>
  <h1>Running Browser Tests...</h1>
  <div id="test-results">Testing...</div>

  <!-- Load all project scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/sample-questions.js"></script>
  <script src="js/store.js"></script>
  <script src="js/csv-manager.js"></script>
  <script src="js/question-admin.js"></script>
  <script src="js/admin-dashboard.js"></script>
  <script src="js/student-dashboard.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>

  <script>
    (async function() {
      const results = [];
      const log = (msg, pass = true) => {
        results.push((pass ? '[PASS] ' : '[FAIL] ') + msg);
        console.log((pass ? '[PASS] ' : '[FAIL] ') + msg);
      };

      let errorMsg = null;

      try {
        // Test 1: Store initialization
        await Store.init();
        log('Store initialized successfully');

        // Test 2: Sample questions loaded into cache
        const cache = Store.getCache();
        log(`Store cache has ${cache.length} sample questions`, cache.length >= 63);

        // Test 3: Active Question Bank query
        const asiaEasy = Store.getActiveQuestionBank('Asia', 'Easy');
        log(`Store.getActiveQuestionBank('Asia', 'Easy') returned ${asiaEasy.length} questions`, asiaEasy.length >= 3);

        // Test 4: CsvManager parsing of template CSV
        const sampleCsv = `Question ID,Question,Option A,Option B,Option C,Option D,Correct Answer,Continent,Difficulty,Topic,Explanation
test-1,"What is the largest ocean in the world?","Atlantic Ocean","Indian Ocean","Pacific Ocean","Arctic Ocean",C,Asia,Easy,Water Bodies,"The Pacific Ocean covers over 30% of the Earth's surface."
test-2,"Which mountain is tallest in Africa?","Mount Kenya","Mount Kilimanjaro","Atlas Mountains","Mount Meru",B,Africa,Easy,Mountains,"Mount Kilimanjaro rises to 5,895 meters."
test-3,"Which desert is the largest hot desert?","Gobi Desert","Kalahari Desert","Sahara Desert","Arabian Desert",C,Africa,Easy,Deserts,"The Sahara covers approximately 9 million square km."`;

        const valRes = CsvManager.parseAndValidateCSV(sampleCsv, cache);
        log(`CSV Validation returned success: ${valRes.success}`, valRes.success === true);
        log(`CSV Validation parsed ${valRes.validQuestions.length} valid questions`, valRes.validQuestions.length === 3);
        log(`CSV Validation found 0 errors`, valRes.invalidRows.length === 0);

        // Test 5: CSV Duplicate Detection
        const dupCsv = `Question ID,Question,Option A,Option B,Option C,Option D,Correct Answer,Continent,Difficulty,Topic,Explanation
test-1,"What is the largest ocean in the world?","Atlantic Ocean","Indian Ocean","Pacific Ocean","Arctic Ocean",C,Asia,Easy,Water Bodies,"Duplicate"`;
        const dupRes = CsvManager.parseAndValidateCSV(dupCsv, valRes.validQuestions.map(v => v.questionObj));
        log(`CSV Duplicate detection caught duplicate ID: ${dupRes.duplicateQuestions.length} duplicate(s)`, dupRes.duplicateQuestions.length === 1);

        // Test 6: CSV Error Handling (invalid continent, duplicate options, invalid correct answer)
        const errorCsv = `Question ID,Question,Option A,Option B,Option C,Option D,Correct Answer,Continent,Difficulty,Topic,Explanation
err-1,"Question with duplicate options?","Paris","London","Paris","Berlin",A,Europe,Easy,Capitals,"Option A and C are both Paris"
err-2,"Question with invalid continent?","Opt 1","Opt 2","Opt 3","Opt 4",B,Atlantis,Easy,Mythology,"Invalid continent"
err-3,"Question with invalid correct answer?","Opt 1","Opt 2","Opt 3","Opt 4",Z,Europe,Easy,General,"Correct answer Z does not exist"`;
        const errRes = CsvManager.parseAndValidateCSV(errorCsv, []);
        log(`CSV Validation rejected ${errRes.invalidRows.length} invalid rows`, errRes.invalidRows.length === 3);

        // Test 7: Store batch import with duplicate skipping
        const importRes = await Store.importQuestionsBatch(valRes.validQuestions.map(v => v.questionObj), 'skip');
        log(`Store.importQuestionsBatch imported ${importRes.added} questions`, importRes.added === 3);

        // Test 8: PAGINATION TEST WITH > 100 QUESTIONS IN ONE CATEGORY (Requirement 3 & 9)
        // Generate 105 distinct questions for Asia - Easy
        const bulkAsiaQuestions = [];
        for (let i = 1; i <= 105; i++) {
          bulkAsiaQuestions.push({
            id: `asia-bulk-${i}`,
            continent: 'Asia',
            difficulty: 'Easy',
            topic: i % 2 === 0 ? 'Water Bodies' : 'Capitals',
            question: `Asia Easy Test Question #${i}: What is the geography feature ${i}?`,
            options: [`Choice A ${i}`, `Choice B ${i}`, `Choice C ${i}`, `Choice D ${i}`],
            correctIndex: (i % 4),
            explanation: `Explanation for question #${i}`,
            status: 'published'
          });
        }
        await Store.importQuestionsBatch(bulkAsiaQuestions, 'overwrite');
        
        const allAsiaEasy = Store.queryQuestions({ continent: 'Asia', difficulty: 'Easy' });
        log(`Total Asia Easy questions in bank: ${allAsiaEasy.length} (> 100 questions)`, allAsiaEasy.length >= 105);

        // Test Pagination at 25 per page
        const pageSize25 = 25;
        const totalPages25 = Math.ceil(allAsiaEasy.length / pageSize25);
        log(`Total pages for size 25: ${totalPages25} pages`, totalPages25 >= 5);

        // Page 1
        const page1 = allAsiaEasy.slice(0, pageSize25);
        log(`Page 1 contains ${page1.length} questions (indices 1..25)`, page1.length === 25);

        // Final Page
        const lastPageIdx = (totalPages25 - 1) * pageSize25;
        const finalPage = allAsiaEasy.slice(lastPageIdx, lastPageIdx + pageSize25);
        log(`Final page ${totalPages25} accessible and contains ${finalPage.length} questions (reaches question #${allAsiaEasy.length})`, finalPage.length === (allAsiaEasy.length - lastPageIdx));

        // Test Pagination at 50 per page
        const pageSize50 = 50;
        const totalPages50 = Math.ceil(allAsiaEasy.length / pageSize50);
        log(`Total pages for size 50: ${totalPages50} pages`, totalPages50 >= 3);

        // Test Pagination at 100 per page
        const pageSize100 = 100;
        const totalPages100 = Math.ceil(allAsiaEasy.length / pageSize100);
        log(`Total pages for size 100: ${totalPages100} pages`, totalPages100 >= 2);

        // Test 9: Student attempt recording, duration & percentage calculation (Requirement 5 & 6)
        const startedTime = new Date('2026-10-18T10:00:00.000Z');
        const completedTime = new Date('2026-10-18T10:02:45.000Z');
        const durationSecs = Math.round((completedTime - startedTime) / 1000); // 165 seconds = 02:45
        const totalQ = 10;
        const correctQ = 8;
        const accuracyPct = Math.round((correctQ / totalQ) * 100); // 80%

        const attempt1 = {
          studentId: 'STU-MAYA-2026',
          studentName: 'Maya Lin',
          continent: 'Asia',
          difficulty: 'Easy',
          mode: 'practice',
          startedAt: startedTime.toISOString(),
          completedAt: completedTime.toISOString(),
          secondsElapsed: durationSecs,
          totalQuestions: totalQ,
          correctCount: correctQ,
          incorrectCount: totalQ - correctQ,
          scorePercent: accuracyPct,
          questionSnapshots: [
            { id: 'asia-1', question: 'Sample Q', options: ['A','B','C','D'], correctIndex: 0, selectedIndex: 0, isCorrect: true, explanation: 'Exp 1' }
          ]
        };
        const attId1 = await Store.saveAttempt(attempt1);
        log(`Saved attempt with duration ${durationSecs}s and score ${accuracyPct}%`, !!attId1 && durationSecs === 165 && accuracyPct === 80);

        // Second attempt by same student for Asia - Easy (verifying all attempts are preserved separately)
        const attempt2 = {
          studentId: 'STU-MAYA-2026',
          studentName: 'Maya Lin',
          continent: 'Asia',
          difficulty: 'Easy',
          mode: 'exam',
          startedAt: new Date('2026-10-18T10:10:00.000Z').toISOString(),
          completedAt: new Date('2026-10-18T10:11:30.000Z').toISOString(),
          secondsElapsed: 90,
          totalQuestions: 10,
          correctCount: 10,
          incorrectCount: 0,
          scorePercent: 100,
          questionSnapshots: [
            { id: 'asia-1', question: 'Sample Q', options: ['A','B','C','D'], correctIndex: 0, selectedIndex: 0, isCorrect: true, explanation: 'Exp 1' }
          ]
        };
        await Store.saveAttempt(attempt2);

        const mayaAttempts = await Store.getStudentAttempts('STU-MAYA-2026');
        log(`Maya Lin has 2 distinct attempts preserved separately for Asia - Easy`, mayaAttempts.length === 2);
        log(`Attempt 1 has score ${mayaAttempts[0].scorePercent}%, Attempt 2 has score ${mayaAttempts[1].scorePercent}%`, mayaAttempts[0].scorePercent === 80 && mayaAttempts[1].scorePercent === 100);

        // Another student STU-LIAM-2026
        const attemptLiam = {
          studentId: 'STU-LIAM-2026',
          studentName: 'Liam Chen',
          continent: 'Europe',
          difficulty: 'Medium',
          mode: 'practice',
          startedAt: new Date().toISOString(),
          completedAt: new Date().toISOString(),
          secondsElapsed: 50,
          totalQuestions: 5,
          correctCount: 4,
          incorrectCount: 1,
          scorePercent: 80,
          questionSnapshots: []
        };
        await Store.saveAttempt(attemptLiam);

        // Student Privacy Check: Maya cannot see Liam's attempts
        const mayaQuery = await Store.getStudentAttempts('STU-MAYA-2026');
        const liamOnly = mayaQuery.filter(a => a.studentId === 'STU-LIAM-2026');
        log(`Student Privacy: Maya cannot see Liam Chen's private attempts`, liamOnly.length === 0);

        // Admin Filter Check: Admin searches for "Maya"
        const adminMayaAttempts = await Store.getAllAttempts({ studentSearch: 'Maya' });
        log(`Admin filter by student search 'Maya' returned 2 records`, adminMayaAttempts.length === 2);

        // Admin Filter Check: Admin filters by continent 'Europe'
        const adminEuropeAttempts = await Store.getAllAttempts({ continent: 'Europe' });
        log(`Admin filter by continent 'Europe' returned Liam's attempt`, adminEuropeAttempts.length >= 1 && adminEuropeAttempts[0].studentId === 'STU-LIAM-2026');

        // Test 10: Admin authentication
        const validPass = await Store.verifyAdminPasscode('admin2026');
        log(`Default admin passcode 'admin2026' verified`, validPass === true);
        const invalidPass = await Store.verifyAdminPasscode('wrongpassword');
        log(`Incorrect passcode rejected`, invalidPass === false);

      } catch (err) {
        log(`FATAL ERROR: ${err.message}`, false);
        errorMsg = err.stack || err.message;
      }

      // POST results back to test server
      try {
        await fetch('/test-result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ logs: results, error: errorMsg })
        });
      } catch (e) {
        console.error('Failed to post test results:', e);
      }
    })();
  </script>
</body>
</html>
