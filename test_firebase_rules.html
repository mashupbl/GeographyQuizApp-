<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Firebase & Security Rules Evaluation Test Suite</title>
</head>
<body>
  <h1>Running Firebase Security Rules & Permissions Tests...</h1>
  <div id="results"></div>

  <!-- Load project scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/sample-questions.js"></script>
  <script src="js/store.js"></script>
  <script src="js/csv-manager.js"></script>
  <script src="js/question-admin.js"></script>
  <script src="js/admin-dashboard.js"></script>
  <script src="js/student-dashboard.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>

  <script>
    (async function() {
      const logs = [];
      const log = (msg, pass = true) => {
        logs.push((pass ? '[PASS] ' : '[FAIL] ') + msg);
        console.log((pass ? '[PASS] ' : '[FAIL] ') + msg);
      };

      let errorMsg = null;

      try {
        // ===================================================================
        // 1. LOCAL MODE & DATA INTEGRITY VERIFICATION
        // ===================================================================
        await Store.init();
        log('Local Mode initialized cleanly');

        const cache = Store.getCache();
        log(`Sample questions present in cache: ${cache.length} (Expected: 84)`, cache.length === 84);

        // Verify question structure
        const q0 = cache[0];
        const validSchema = q0 && q0.id && q0.question && Array.isArray(q0.options) && q0.options.length === 4 && typeof q0.correctIndex === 'number';
        log('Question schema conforms to standard (id, question, 4 options, correctIndex, explanation)', validSchema);

        // ===================================================================
        // 2. FIRESTORE SECURITY RULES FORMAL EVALUATION ENGINE
        // ===================================================================
        // This evaluator directly mirrors firestore.rules logic line-by-line:
        function evaluateFirestoreRule(action, path, auth, resourceData, requestResourceData) {
          const isAuthenticated = () => auth != null && auth.uid != null;
          
          // Helper: isAdmin()
          const isAdmin = () => {
            if (!isAuthenticated()) return false;
            if (auth.token && auth.token.admin === true) return true;
            // Document exists in /admins/{uid}
            if (auth.isAdminDocExists === true) return true;
            return false;
          };

          const pathParts = path.split('/').filter(Boolean);
          const collection = pathParts[0];
          const docId = pathParts[1];

          // 1. Questions Collection: /questions/{questionId}
          if (collection === 'questions') {
            if (action === 'read') return isAuthenticated();
            if (action === 'write' || action === 'create' || action === 'update' || action === 'delete') {
              return isAdmin();
            }
          }

          // 2. Attempts Collection: /attempts/{attemptId}
          if (collection === 'attempts') {
            if (action === 'create') {
              return isAuthenticated() && requestResourceData && requestResourceData.studentUid === auth.uid;
            }
            if (action === 'read') {
              return isAuthenticated() && (
                (resourceData && resourceData.studentUid === auth.uid) ||
                isAdmin()
              );
            }
            if (action === 'update') {
              return false; // immutable audit logs
            }
            if (action === 'delete') {
              return isAdmin();
            }
          }

          // 3. Students Collection: /students/{studentUid}
          if (collection === 'students') {
            if (action === 'read') {
              return isAuthenticated() && (auth.uid === docId || isAdmin());
            }
            if (action === 'create' || action === 'update') {
              return isAuthenticated() && (auth.uid === docId || isAdmin());
            }
            if (action === 'delete') {
              return isAdmin();
            }
          }

          // 4. Admins Collection: /admins/{adminUid}
          if (collection === 'admins') {
            if (action === 'read') return isAuthenticated();
            if (action === 'write' || action === 'create' || action === 'update' || action === 'delete') {
              return false; // strictly DENIED from client
            }
          }

          // 5. Config Collection: /config/{configId}
          if (collection === 'config') {
            if (action === 'read') return isAuthenticated();
            if (action === 'write' || action === 'create' || action === 'update' || action === 'delete') {
              return isAdmin();
            }
          }

          return false;
        }

        // ===================================================================
        // 3. TEST SUITE: SECURITY RULES PERMISSION CHECKS
        // ===================================================================

        // Define actors
        const studentA = { uid: 'student-auth-uid-AAA', token: {} };
        const studentB = { uid: 'student-auth-uid-BBB', token: {} };
        const unauthenticatedUser = null;
        const verifiedAdminClaims = { uid: 'admin-claims-uid', token: { admin: true } };
        const verifiedAdminDoc = { uid: 'admin-doc-uid', token: {}, isAdminDocExists: true };
        const unverifiedUser = { uid: 'normal-user-uid', token: {}, isAdminDocExists: false };

        // Test 2.1: Questions Collection
        log('Rule Check: Unauthenticated user cannot read questions', 
          evaluateFirestoreRule('read', 'questions/q1', unauthenticatedUser) === false);
        log('Rule Check: Authenticated student can read questions', 
          evaluateFirestoreRule('read', 'questions/q1', studentA) === true);
        log('Rule Check: Authenticated student CANNOT write questions', 
          evaluateFirestoreRule('create', 'questions/q1', studentA, null, { question: 'Hacked?' }) === false);
        log('Rule Check: Unverified user CANNOT write questions', 
          evaluateFirestoreRule('create', 'questions/q1', unverifiedUser, null, { question: 'Hacked?' }) === false);
        log('Rule Check: Verified Admin (Custom Claim) CAN write questions', 
          evaluateFirestoreRule('create', 'questions/q1', verifiedAdminClaims, null, { question: 'New Question' }) === true);
        log('Rule Check: Verified Admin (/admins doc) CAN write questions', 
          evaluateFirestoreRule('create', 'questions/q1', verifiedAdminDoc, null, { question: 'New Question' }) === true);

        // Test 2.2: Attempts Collection Creation & Immutability
        log('Rule Check: Student can create attempt with their own studentUid',
          evaluateFirestoreRule('create', 'attempts/att-1', studentA, null, { studentUid: 'student-auth-uid-AAA' }) === true);
        log('Rule Check: Student CANNOT create attempt with forged/another studentUid',
          evaluateFirestoreRule('create', 'attempts/att-1', studentA, null, { studentUid: 'student-auth-uid-BBB' }) === false);
        log('Rule Check: Attempt records are IMMUTABLE (Student cannot update attempt)',
          evaluateFirestoreRule('update', 'attempts/att-1', studentA, { studentUid: 'student-auth-uid-AAA' }, { scorePercent: 100 }) === false);
        log('Rule Check: Attempt records are IMMUTABLE (Even Admin cannot update past attempt)',
          evaluateFirestoreRule('update', 'attempts/att-1', verifiedAdminClaims, { studentUid: 'student-auth-uid-AAA' }, { scorePercent: 100 }) === false);

        // Test 2.3: Attempts Isolation & Privacy
        log('Rule Check: Student A can read their own attempt',
          evaluateFirestoreRule('read', 'attempts/att-1', studentA, { studentUid: 'student-auth-uid-AAA' }) === true);
        log('Rule Check: Student B CANNOT read Student A private attempt',
          evaluateFirestoreRule('read', 'attempts/att-1', studentB, { studentUid: 'student-auth-uid-AAA' }) === false);
        log('Rule Check: Verified Admin CAN read Student A attempt for practice monitoring',
          evaluateFirestoreRule('read', 'attempts/att-1', verifiedAdminDoc, { studentUid: 'student-auth-uid-AAA' }) === true);
        log('Rule Check: Student CANNOT delete attempts',
          evaluateFirestoreRule('delete', 'attempts/att-1', studentA, { studentUid: 'student-auth-uid-AAA' }) === false);
        log('Rule Check: Verified Admin CAN delete attempts',
          evaluateFirestoreRule('delete', 'attempts/att-1', verifiedAdminClaims, { studentUid: 'student-auth-uid-AAA' }) === true);

        // Test 2.4: Students Collection Isolation
        log('Rule Check: Student A can read and update their own profile /students/student-auth-uid-AAA',
          evaluateFirestoreRule('read', 'students/student-auth-uid-AAA', studentA) === true &&
          evaluateFirestoreRule('update', 'students/student-auth-uid-AAA', studentA) === true);
        log('Rule Check: Student B CANNOT read or update Student A profile /students/student-auth-uid-AAA',
          evaluateFirestoreRule('read', 'students/student-auth-uid-AAA', studentB) === false &&
          evaluateFirestoreRule('update', 'students/student-auth-uid-AAA', studentB) === false);
        log('Rule Check: Verified Admin CAN read student profiles for monitoring',
          evaluateFirestoreRule('read', 'students/student-auth-uid-AAA', verifiedAdminClaims) === true);

        // Test 2.5: Protected Admins Collection Privilege Escalation Defense
        log('Rule Check: Client write to /admins collection is STRICTLY DENIED (prevents privilege escalation)',
          evaluateFirestoreRule('write', 'admins/attacker-uid', unverifiedUser) === false &&
          evaluateFirestoreRule('create', 'admins/attacker-uid', studentA) === false &&
          evaluateFirestoreRule('update', 'admins/attacker-uid', verifiedAdminClaims) === false);

        // ===================================================================
        // 4. FIREBASE CONFIG MANAGER UNIT TESTS
        // ===================================================================
        const cfg = FirebaseManager.getConfig();
        log('FirebaseManager contains valid projectId: ' + (cfg ? cfg.projectId : 'none'), 
          cfg && cfg.projectId === 'geoquizexplorer-bc2ee');
        log('FirebaseManager contains valid apiKey: ' + (cfg ? cfg.apiKey.substring(0, 8) + '...' : 'none'), 
          cfg && cfg.apiKey.startsWith('AIzaSy'));

        // Test connection tester helper
        const connTest = await FirebaseManager.testConnection();
        log('FirebaseManager testConnection handles call gracefully: ' + connTest.success, typeof connTest.success === 'boolean');

        // Test offline fallback resilience
        log('Store.isCloudActive() reports correctly in current environment: ' + Store.isCloudActive(), typeof Store.isCloudActive() === 'boolean');

      } catch (err) {
        log(`FATAL ERROR: ${err.message}`, false);
        errorMsg = err.stack || err.message;
      }

      // POST results back to python test server
      try {
        await fetch('/test-result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ logs: logs, error: errorMsg })
        });
      } catch (e) {
        console.error('Failed to post test results:', e);
      }
    })();
  </script>
</body>
</html>
